description: Terminal UI for docker
options:
  version:
    default: 0.25.2
    help: Release version to install
    pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]*$'
system: |
  RUN curl -fsSL https://github.com/jesseduffield/lazydocker/releases/download/v{{.Opt.version}}/lazydocker_{{.Opt.version}}_Linux_{{arch "arm64" "x86_64"}}.tar.gz \
          | tar -xz -C /usr/local/bin lazydocker \
      && chmod 755 /usr/local/bin/lazydocker
