description: uv Python package manager (checksum-verified)
options:
  version:
    default: 0.13.8
    help: Release version to install
    pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]*$'
system: |
  # uv, checksum-verified against the release's .sha256 asset
  RUN set -eux; \
      base=https://github.com/astral-sh/uv/releases/download/{{.Opt.version}}; \
      triple={{arch "aarch64" "x86_64"}}-unknown-linux-gnu; \
      file=uv-$triple.tar.gz; \
      cd /tmp; \
      curl -fsSLO "$base/$file"; \
      curl -fsSL "$base/$file.sha256" | sha256sum -c -; \
      tar -xzf "$file" -C /usr/local/bin --strip-components=1 "uv-$triple/uv"; \
      rm -f "$file"; \
      uv --version
