description: Terminal UI for git
options:
  version:
    default: 0.66.2
    help: Release version to install
    pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]*$'
system: |
  RUN curl -fsSL https://github.com/jesseduffield/lazygit/releases/download/v{{.Opt.version}}/lazygit_{{.Opt.version}}_linux_{{arch "arm64" "x86_64"}}.tar.gz \
          | tar -xz -C /usr/local/bin lazygit \
      && chmod 755 /usr/local/bin/lazygit
